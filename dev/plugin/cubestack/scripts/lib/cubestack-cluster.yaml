# CubeStackCluster — the platform profile this skill installs.
#
# This is a REPO ARTIFACT, copied into the bootstrap pod and applied by
# `operator-up` (Step 7). It is a file rather than a `--set` argument list for
# the reason the whole step is a script: "which components are enabled is
# hardcoded" is something a reader can audit here in ten seconds, and something
# a reviewer can diff when the profile changes. `operator-wait` then polls this
# object's status until Ready.
#
# THIS PROFILE MIRRORS THE CHART'S OWN DEFAULT. The operator chart ships a
# sample `CubeStackCluster` as its `clusterCR.spec`
# (`helm/cubestack-operator-chart/values.yaml`), and this file enables every
# component that sample enables — twelve of the catalog's thirteen. Mirrored
# from the chart at commit 083d444 (2026-10-15) and re-checked unchanged at
# 90be297; the sample moved twice before that (`aiGateway` and
# `exporters.metax` were flipped on by #41 and #46), which is the drift this
# note exists to make visible.
#
# THE THREE DEVIATIONS FROM THAT SAMPLE:
#
#   * `global.imagePullPolicy` is `Always` rather than the sample's
#     `IfNotPresent`; see the note under `global` below.
#
#   * `exporters.bmc` is DISABLED, and it is the only default-enabled component
#     that CANNOT converge on a fresh box. It is driven entirely by the
#     admin-owned Secret `cubestack-bmc-credentials` in `monitoring` (keys
#     `username`, `password`, `hosts`) — the chart's `values.bmc.*` block is
#     dead, `spec.components.exporters.bmc.values` no longer configures it — and
#     the operator reads that Secret but never creates it. A missing or unusable
#     one is a hard error (`readComponentSettings`), not a skip: the component
#     reports Degraded, that blocks the CR's Ready condition, and `operator-wait`
#     fails the whole run with E_OPERATOR_COMPONENT_DEGRADED. So it ships
#     listed-but-off. To turn it on: create that Secret first (at least one BMC
#     management IP is required — both exporter pods exit at startup on an empty
#     host list), then flip the line below.
#   * `deletePolicy` is `retain` rather than the sample's `uninstall`; see the
#     bottom of this file.
#
# THE INSTALLER'S OWN CR IS NARROWER THAN THIS ONE, and `operator-up` ADOPTS it
# where it exists. The deploy's `cubestack_operator` module installs the same
# chart with `clusterCR.enabled` on, pinned to the chart defaults minus the same
# `exporters.bmc` and minus `modelBundles` + `spec.bundles` (it clears both, on
# the grounds that the bundles are inference profiles rather than platform
# services). On such a box the adopted profile is what runs and this file is the
# fallback — used only where the deploy installed no platform at all.
#
# The install order is the OPERATOR'S catalog order (each component's `order`
# field), NOT the YAML order below — lws (10) and envoyGateway (20) come up
# before cubestackControllerManager (30), which hard-depends on both. Exactly one
# dependency is enforced at run time: `modelBundles` (35) declares
# `requires: cubestack-controller-manager` and goes Degraded — not Pending — if
# that component is off.
#
# The twelve enabled, by catalog order:
#   lws (10)                        Leader Worker Set controller + its CRDs.
#                                   cubestack hard-depends on the LWS CRDs.
#   envoyGateway (20)               Gateway API CRDs, the envoy-gateway control
#                                   plane, and the "gateway" GatewayClass.
#   aiGateway (21)                  Envoy AI Gateway controller + its CRDs.
#                                   Needs envoyGateway's data plane — enforced
#                                   as a `siblingValues` injection applied only
#                                   while it is Ready, not as a `requires`.
#   cubestackControllerManager (30) The platform workload operator + CRDs.
#   modelBundles (35)               Applies the model catalog `spec.bundles`
#                                   lists. No health checks — the objects are
#                                   custom resources whose readiness belongs to
#                                   the controller-manager — and no inference
#                                   pods: a bundle's InferenceService ships as
#                                   `isvc.example.yaml`, which the operator does
#                                   not apply.
#   prometheus (40)                 kube-prometheus-stack, Grafana included.
#   perses (50)                     Perses dashboards.
#   exporters.metax (65)            A PATCH, not a workload: it flips
#                                   `dataExporter.deploy` on the vendor MetaX
#                                   operator's ClusterOperator. Catalog
#                                   `missingTarget: skip`, so on a cluster with
#                                   no MetaX operator it reports Skipped and the
#                                   cluster still reaches Ready.
#   cuberouter (70)                 The model router.
#   cubepilot (80)                  The node/storage pilot.
#   cubestackPortal (90)            The web portal.
#   observability (100)             The dashboards and service-monitors layer
#                                   over prometheus, perses and grafana.
#
# `global` keeps the operator's own documented defaults — the same values its
# sample CR uses — with ONE deliberate deviation: imagePullPolicy, explained
# below. Nothing here is a per-run choice: the cluster is expected to reach
# Harbor directly, so component images come from
# `<imageRegistry>/<name>` and third-party images from the mirror prefix. That is
# why this step changes no `images.manifest` and pushes nothing into the
# in-cluster registry.
#
# imagePullSecrets names a Secret the OPERATOR reads on every reconcile, in its
# OWN namespace. `operator-up` creates it there BEFORE the chart is installed;
# with it absent the reconcile fails before touching any component, so the CR
# never converges and reports nothing. See that script's Secret section.
#
# The same Secret is ALSO copied into every component namespace, for a different
# consumer with a different rule: the kubelet reads imagePullSecrets only from
# the pod's own namespace, so the operator-side copy does nothing for a pod in
# lws-system. `operator-up` covers those namespaces too.
#
# imagePullPolicy: Always because the platform's own images are tagged :latest —
# the CRD's own words, "where a node that cached the image would never re-pull
# it". The default is IfNotPresent, which on a long-lived cluster silently pins
# whatever build the node first saw. Third-party components keep their own
# chart's policy either way; this reaches only the platform's own images.
apiVersion: operator.cubestack.io/v1alpha1
kind: CubeStackCluster
metadata:
  name: cubestack
  namespace: cubestack-system
spec:
  global:
    imageRegistry: harbor.isuanova.com/suanova
    externalImageRegistryPrefix: harbor.isuanova.com/mirrors
    imagePullSecrets:
      - harbor-credentials
    imagePullPolicy: Always
  # The model catalog `modelBundles` applies. An EXACT list: removing a name
  # deletes the objects that bundle's apply created (its
  # InferenceRuntimeProfile, ModelVersion and ConfigMaps — each carries a
  # `cubestack.io/bundle` label so they can be selected), and an empty list
  # applies nothing rather than everything. An unknown name is an error, not a
  # silent skip. This is the chart's own list.
  bundles:
    - metax-sglang-dsv4-pd
    - metax-sglang-dsv4-pd-mooncake
    - metax-sglang-h3
    - metax-sglang-qwen-image21
    - metax-vllm-dsv4-flash
    - metax-vllm-dsv4-flash-pd
    - metax-vllm-qwen3.8-27b
    - metax-vllm-qwen3.8-27b-s3
  components:
    lws:
      enabled: true
    envoyGateway:
      enabled: true
    aiGateway:
      enabled: true
    cubestackControllerManager:
      enabled: true
      # Hostname the published models are served under, and the chart's own
      # default. It is load-bearing rather than cosmetic: with it empty the
      # component omits --gateway-catalog-hostname, publishing stays off, and
      # every InferenceService sits at RouteReady=False. Point it at a name your
      # resolving infrastructure answers for — replace it here, or pass values
      # over `spec.components.cubestackControllerManager.values` (the operator
      # deep-merges those LAST, after catalog defaults and global injection).
      values:
        gateway:
          catalogHostname: ai.cubestack.dev
    prometheus:
      enabled: true
      # Also the chart's default. Grafana has no other account, so with this
      # cleared the UI is left on whatever the subchart generates. A shared,
      # publicly known value — a default that makes a fresh box loggable, not a
      # credential for anything reachable.
      values:
        grafana:
          adminPassword: "admin"
    perses:
      enabled: true
    exporters:
      # DISABLED, and the one component that cannot converge unattended: it is
      # driven by the admin-owned Secret `cubestack-bmc-credentials` in
      # `monitoring`, which the operator reads and never creates, and a missing
      # one makes the component Degraded — which blocks the cluster's Ready and
      # fails `operator-wait`. Kept here as a decision rather than an omission.
      # See this file's header for how to turn it on.
      bmc:
        enabled: false
      # No values: the component patches the vendor MetaX operator's
      # cluster-scoped ClusterOperator to enable its data exporter, and reports
      # Skipped where that operator is not installed.
      metax:
        enabled: true
    cuberouter:
      enabled: true
    cubepilot:
      enabled: true
    cubestackPortal:
      enabled: true
      # The portal's login credential. This is NOT optional decoration: the
      # portal chart gates its htpasswd Secret on this value being non-empty
      # (`templates/portal/htpasswd.yaml` opens with
      # `{{- if .Values.secrets.htpasswd.content -}}`), so with no `content`
      # the Secret is never created and the portal has no account to log in
      # with. Enabling the component is not the same as giving it a credential.
      #
      # The value is one `user:bcrypt-hash` line — already hashed, not a
      # password, and not base64. This particular hash is the operator chart's
      # own published default for its bundled clusterCR (and the example in the
      # portal chart's README), so it is a shared, publicly known credential:
      # fine as a default that makes a fresh box loggable, wrong for anything
      # reachable. Replace it per-site by overriding this same path — either
      # edit this manifest's copy, or pass values over `spec.components
      # .cubestackPortal.values`, which the operator deep-merges LAST (after
      # catalog defaults and global injection) so an explicit override always
      # wins. Generate a line with: htpasswd -nB <user>
      values:
        secrets:
          htpasswd:
            content: 'admin:$2a$10$9/nTwyvmfwMdwc.OSsoZFe9gTfGfoCVdKIcSwcQWb6Qll7TmygG26'
    observability:
      enabled: true
    modelBundles:
      enabled: true
  # retain (the default) is stated rather than omitted: deleting this CR must
  # not take the platform down with it. `uninstall` removes the components;
  # either way the operator keeps CRDs and PVCs. The chart's sample CR chooses
  # `uninstall` — that is right for a chart-managed install, where the CR is
  # part of the release and must go with it, and wrong here, where this CR is
  # applied by hand and lives on after the run.
  deletePolicy: retain
